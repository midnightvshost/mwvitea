<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ | Midnight Webs</title><meta name="description" content="Answers to common questions about Midnight Webs website design, pricing, hosting, security, online stores and ongoing maintenance."><link rel="canonical" href="https://www.midnightwebs.com/ro/faq/"><link rel="stylesheet" href="../../assets/css/style.css"><style>header{position:sticky;top:0;background:rgba(5,9,20,.94);border-bottom:1px solid rgba(143,178,255,.14);padding:18px 0;z-index:5}.faq-nav{max-width:1180px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}.faq-brand{font:600 13px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#8fb4ff;text-decoration:none}.faq-brand em{font-style:normal;color:#f2f5ff}.faq-links{display:flex;gap:8px;flex-wrap:wrap}.faq-links a{font:500 11px "JetBrains Mono",monospace;text-decoration:none;border:1px solid rgba(143,178,255,.24);padding:8px 10px;color:#c4cbe2}.faq-links a:hover,.faq-links a.active{border-color:#8fb4ff;color:white}.faq-page{max-width:900px;margin:0 auto;padding:120px 24px 80px}.faq-page h1{font-size:clamp(42px,7vw,76px);margin:0 0 14px}.faq-page .intro{color:var(--muted);margin-bottom:36px}.faq-item{border-bottom:1px solid var(--line);padding:22px 0}.faq-item summary{cursor:pointer;font-size:19px;font-weight:700}.faq-item p{color:var(--muted);line-height:1.8;margin-top:14px}@media(max-width:700px){.faq-nav{align-items:flex-start;flex-direction:column}.faq-page{padding-top:64px}}.faq-contact{margin-top:42px}</style></head><body><header><nav class="faq-nav"><a class="faq-brand" href="../../">Midnight<em>Webs</em></a><div class="faq-links"><a href="../../">Home</a><a href="../../careers/">Careers</a><a href="../../privacy/">Privacy</a><a href="../../terms/">Terms</a><a data-l="en" href="/faq/">EN</a><a data-l="ro" href="/ro/faq/">RO</a><a data-l="ru" href="/ru/faq/">RU</a></div></nav></header><main class="faq-page"><h1 data-t="title">Frequently asked questions</h1><p class="intro" data-t="intro">Straight answers about our websites, plans and ongoing support.</p><div id="faq"></div><p class="faq-contact"><a href="../#contact" data-t="contact">Have another question? Get in touch.</a></p></main><script>
const content={
en:{eyebrow:'Help center',title:'Frequently asked questions',intro:'Straight answers about our websites, plans and ongoing support.',contact:'Have another question? Get in touch.',items:[['What does Midnight Webs do?','We design and build custom websites, then provide hosting, security monitoring, backups and ongoing maintenance. Depending on your needs, we also build backends, online stores and custom features.'],['How much does a website cost?','The Foundation and Growth plans have a monthly fee plus a one-time build fee. Enterprise projects are scoped individually. The exact build price is agreed before work begins, so you know what is included.'],['What is included in the monthly plans?','Every plan includes hosting and security. Foundation covers a custom site of up to 3 pages, managed hosting, SSL, daily backups, malware and uptime monitoring, email support and one hour of changes each month. Growth covers up to 10 pages, priority hosting, SSL, backups and firewall, monthly performance optimization, SEO-ready structure, priority support and four hours of changes each month.'],['How long does it take to launch?','The discovery stage usually takes 1–2 days, design and build takes about 1–3 weeks, and launch preparation takes 1–2 days. Timing depends on the project and how quickly content and feedback are provided.'],['Can you build an online store or custom backend?','Yes. We build online stores with secure payments, product and inventory management, and shipping setup. We can also build APIs, databases, user accounts, payment flows and admin panels. These are scoped to the project.'],['Do you provide hosting, SSL and backups?','Yes. Hosting, SSL, backups and monitoring are handled as part of the plans. The site describes daily backups and 99.9% average uptime; actual availability can vary with third-party infrastructure.'],['Can you update my existing website?','Yes. We can review existing sites, make improvements, provide ongoing maintenance, or perform security audits and penetration testing. The work is scoped after we understand the site.'],['What do the monthly changes cover?','Foundation includes one hour of changes each month; Growth includes four hours of changes; Enterprise development time is agreed individually. Larger features or redesigns may need a separate quote.'],['Do you work with businesses in Moldova?','Yes. The site is intended for businesses in Moldova, and visitors can use English, Romanian or Russian. We can discuss your audience, content and language needs during the project call.'],['How do I start a project?','Use the Start a project form on the homepage to describe your business, preferred plan and needs. Submitting opens your email app with a prepared message for you to review and send.']]},
ro:{eyebrow:'Centru de ajutor',title:'Întrebări frecvente',intro:'Răspunsuri clare despre site-uri, planuri și asistență continuă.',contact:'Mai ai o întrebare? Contactează-ne.',items:[['Cu ce se ocupă Midnight Webs?','Proiectăm și construim site-uri personalizate, apoi oferim găzduire, monitorizare de securitate, backup-uri și mentenanță continuă. În funcție de nevoi, construim și backend-uri, magazine online și funcții personalizate.'],['Cât costă un site?','Planurile Foundation și Growth au un tarif lunar plus un tarif unic de construcție. Proiectele Enterprise sunt estimate individual. Prețul exact al construcției este stabilit înainte de începerea lucrului, astfel încât să știi ce este inclus.'],['Ce includ planurile lunare?','Fiecare plan include găzduire și securitate. Foundation include un site personalizat de până la 3 pagini, găzduire administrată, SSL, backup-uri zilnice, monitorizare malware și uptime, suport prin email și o oră de modificări pe lună. Growth include până la 10 pagini, găzduire prioritară, SSL, backup-uri și firewall, optimizare lunară a performanței, structură pregătită pentru SEO, suport prioritar și patru ore de modificări lunar.'],['Cât durează lansarea?','Etapa de descoperire durează de obicei 1–2 zile, designul și construcția aproximativ 1–3 săptămâni, iar pregătirea lansării 1–2 zile. Durata depinde de proiect și de cât de repede primim conținutul și feedbackul.'],['Puteți construi un magazin online sau un backend personalizat?','Da. Construim magazine online cu plăți securizate, gestionarea produselor și stocurilor și configurarea livrării. Putem crea și API-uri, baze de date, conturi de utilizatori, plăți și panouri de administrare. Acestea sunt definite în funcție de proiect.'],['Oferiți găzduire, SSL și backup-uri?','Da. Găzduirea, SSL-ul, backup-urile și monitorizarea sunt gestionate în cadrul planurilor. Site-ul menționează backup-uri zilnice și un uptime mediu de 99,9%; disponibilitatea reală poate depinde de infrastructura terților.'],['Puteți actualiza un site existent?','Da. Putem evalua site-uri existente, face îmbunătățiri, oferi mentenanță continuă sau efectua audituri de securitate și teste de penetrare. Stabilim activitățile după ce înțelegem site-ul.'],['Ce acoperă modificările lunare?','Foundation include o oră de modificări pe lună; Growth include aproximativ două ore de modificări; timpul de dezvoltare pentru Enterprise se stabilește individual. Funcțiile mari sau redesignurile pot necesita o ofertă separată.'],['Lucrați cu afaceri din Moldova?','Da. Site-ul se adresează afacerilor din Moldova, iar vizitatorii pot folosi engleza, româna sau rusa. Putem discuta publicul, conținutul și limbile necesare în timpul primei discuții.'],['Cum încep un proiect?','Folosește formularul „Începe un proiect” de pe pagina principală pentru a descrie afacerea, planul preferat și cerințele. Trimiterea deschide aplicația de email cu un mesaj pregătit, pe care îl poți verifica și trimite.']]},
ru:{eyebrow:'Справочный центр',title:'Часто задаваемые вопросы',intro:'Понятные ответы о сайтах, тарифах и дальнейшей поддержке.',contact:'Остались вопросы? Свяжитесь с нами.',items:[['Чем занимается Midnight Webs?','Мы проектируем и создаём сайты на заказ, а затем обеспечиваем хостинг, мониторинг безопасности, резервное копирование и постоянное обслуживание. По необходимости мы также разрабатываем серверную часть, интернет-магазины и дополнительные функции.'],['Сколько стоит сайт?','Тарифы Foundation и Growth включают ежемесячную оплату и разовую стоимость разработки. Стоимость Enterprise-проектов рассчитывается индивидуально. Точная цена разработки согласуется до начала работ, чтобы вы знали, что входит в проект.'],['Что входит в ежемесячные тарифы?','Каждый тариф включает хостинг и защиту. Foundation включает сайт до 3 страниц, управляемый хостинг, SSL, ежедневные резервные копии, мониторинг вредоносного ПО и доступности, поддержку по email и один час изменений в месяц. Growth включает до 10 страниц, приоритетный хостинг, SSL, резервные копии и файрвол, ежемесячную оптимизацию производительности, структуру для SEO, приоритетную поддержку и четыре часа правок в месяц.'],['Сколько времени занимает запуск?','Знакомство обычно занимает 1–2 дня, дизайн и разработка — около 1–3 недель, подготовка к запуску — 1–2 дня. Срок зависит от проекта и скорости предоставления материалов и обратной связи.'],['Вы можете создать интернет-магазин или серверную часть на заказ?','Да. Мы создаём интернет-магазины с безопасной оплатой, управлением товарами и запасами, а также настройкой доставки. Также можем разработать API, базы данных, аккаунты пользователей, платежи и панели администратора. Объём определяется для каждого проекта.'],['Вы предоставляете хостинг, SSL и резервное копирование?','Да. Хостинг, SSL, резервное копирование и мониторинг входят в обслуживание по тарифам. На сайте указаны ежедневное резервное копирование и средняя доступность 99,9%; фактическая доступность может зависеть от сторонней инфраструктуры.'],['Вы можете обновить существующий сайт?','Да. Мы можем оценить существующий сайт, внести улучшения, обеспечить постоянное обслуживание или провести аудит безопасности и тестирование на проникновение. Объём работ определим после знакомства с сайтом.'],['Что входит в ежемесячные правки?','Foundation включает один час изменений в месяц; Growth — около двух часов правок; время разработки по Enterprise согласуется индивидуально. Для крупных функций или редизайна может потребоваться отдельная оценка.'],['Вы работаете с компаниями в Молдове?','Да. Сайт ориентирован на бизнес в Молдове, и посетители могут выбрать английский, румынский или русский язык. Во время первой беседы обсудим вашу аудиторию, контент и языковые требования.'],['Как начать проект?','Заполните форму «Начать проект» на главной странице: расскажите о компании, интересующем тарифе и требованиях. После отправки откроется почтовое приложение с подготовленным письмом, которое можно проверить и отправить.']]}};
function lang(){return location.pathname.split('/').filter(Boolean)[0]&&['ro','ru'].includes(location.pathname.split('/').filter(Boolean)[0])?location.pathname.split('/').filter(Boolean)[0]:'en'}
function render(l){document.documentElement.lang=l;const d=content[l];document.querySelectorAll('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);document.getElementById('faq').innerHTML=d.items.map(([q,a])=>`<details class="faq-item"><summary>${q}</summary><p>${a}</p></details>`).join('');}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{const l=b.dataset.lang;location.href=(l==='en'?'../../faq/':'../../'+l+'/faq/')});render(lang());
</script></body></html>
